<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku Game</title>
<style>
body {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  margin: 0; padding: 20px; background-color: #f7f7f7; color: #111;
}
h1 { font-weight: 700; font-size: 2rem; margin-bottom: 20px; letter-spacing: 1px; }
button {
  background-color: #111; color: #fff; border: none;
  padding: 10px 18px; font-size: 16px; margin: 6px; cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.5px;
}
button:hover { background-color: #333; }
select {
  padding: 8px 12px; font-size: 16px; border: 2px solid #111;
  background-color: #fff; color: #111; margin-left: 5px;
}
#difficultyContainer { display: flex; align-items: center; margin-bottom: 10px; }
#timer, #difficultyDisplay { font-weight: 600; font-size: 1rem; margin-top: 10px; display:none; }
table { border-collapse: collapse; margin-top: 20px; display:none; }
td {
  width: 50px; height: 50px; text-align: center; vertical-align: middle;
  border: 1px solid #111; font-size: 20px; cursor: pointer; position: relative;
}
td.selected { background-color: #d9f0f0; }
td.clue-selected { background-color: #fce5b3; }
td.fixed { font-weight: 700; color: #000; }
.candidate {
  font-size: 10px; position: absolute; top: 2px; left: 2px;
  display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
  width: 100%; height: 100%; color: #555;
}
.candidate div { text-align: center; }
td:nth-child(3n) { border-right: 2px solid #111; }
tr:nth-child(3n) td { border-bottom: 2px solid #111; }
#controls { display: none; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
</style>
</head>
<body>

<h1>Sudoku</h1>

<div id="difficultyContainer">
  <label>Difficulty:
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
  </label>
</div>

<button id="startBtn" onclick="startGame()">Start New Game</button>

<div id="timer">Time: 00:00</div>
<div id="difficultyDisplay"></div>

<div id="controls">
  <button id="candidateToggle" onclick="toggleCandidateMode()">Candidate Mode: OFF</button>
  <button id="autoCandidateBtn" onclick="toggleAutoCandidateMode()">Auto Candidate Mode: OFF</button>
  <button id="checkBtn" onclick="checkSolution()">Check</button>
  <button id="hintBtn" onclick="getHint()">Hint</button>
</div>

<table id="sudoku-grid"></table>

<script>
let puzzle = [];
let solution = [];
let selectedRow = 0;
let selectedCol = 0;
let timerInterval;
let secondsElapsed = 0;
let candidateMode = false;
let autoCandidateMode = false;
let candidates = {};
let currentDifficulty = '';

/* -------------------------------- TIMER -------------------------------- */

function startTimer() {
  clearInterval(timerInterval);
  secondsElapsed = 0;
  timerInterval = setInterval(() => {
    secondsElapsed++;
    const mins = String(Math.floor(secondsElapsed/60)).padStart(2,'0');
    const secs = String(secondsElapsed%60).padStart(2,'0');
    document.getElementById("timer").textContent = "Time: " + mins + ":" + secs;
  }, 1000);
}

/* -------------------------------- START GAME -------------------------------- */

function startGame() {
  document.getElementById("startBtn").style.display = 'none';
  document.getElementById("difficultyContainer").style.display = 'none';
  document.getElementById("timer").style.display = 'block';
  document.getElementById("difficultyDisplay").style.display = 'block';
  document.getElementById("controls").style.display = 'flex';
  document.getElementById("sudoku-grid").style.display = 'table';

  currentDifficulty = document.getElementById("difficulty").value;
  document.getElementById("difficultyDisplay").textContent =
    "Difficulty: " + currentDifficulty.charAt(0).toUpperCase() + currentDifficulty.slice(1);

  const emptyCells = currentDifficulty === "easy" ? 30 : currentDifficulty === "medium" ? 40 : 50;

  const board = generateSudoku();
  solution = board.map(r => r.slice());
  puzzle = removeCells(board, emptyCells);
  candidates = {};

  renderGrid();
  startTimer();
  selectCell(0,0);

  if (autoCandidateMode) updateAutoCandidates();
}

/* -------------------------------- RENDER GRID -------------------------------- */

function renderGrid() {
  const grid = document.getElementById("sudoku-grid");
  grid.innerHTML = "";

  for (let r = 0; r < 9; r++) {
    const tr = document.createElement("tr");
    for (let c = 0; c < 9; c++) {
      const td = document.createElement("td");
      td.dataset.row = r;
      td.dataset.col = c;

      if (puzzle[r][c] !== null) {
        td.textContent = puzzle[r][c];
        td.classList.add("fixed");
      }

      td.onclick = () => selectCell(r, c);
      tr.appendChild(td);
    }
    grid.appendChild(tr);
  }

  updateCandidatesDisplay();
}

/* -------------------------------- SELECT CELL -------------------------------- */

function selectCell(r,c) {
  const prev = document.querySelector("td.selected,td.clue-selected");
  if (prev) prev.classList.remove("selected","clue-selected");

  const td = document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);

  td.classList.contains("fixed")
    ? td.classList.add("clue-selected")
    : td.classList.add("selected");

  selectedRow = r; 
  selectedCol = c;
}

/* -------------------------------- KEYBOARD INPUT -------------------------------- */

document.addEventListener("keydown",(e)=>{
  const k = e.key;

  if(k===" "){
    e.preventDefault();
    toggleCandidateMode();
  }
  else if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(k)){
    e.preventDefault();
    moveSelection(k);
  }
  else if(k>="1" && k<="9"){
    placeNumber(k);
  }
  else if(["Backspace","Delete","0"].includes(k)){
    clearNumber();
  }
});

function placeNumber(num){
  const td=document.querySelector(`td[data-row="${selectedRow}"][data-col="${selectedCol}"]`);
  if(td.classList.contains("fixed")) return;

  if(candidateMode){
    toggleCandidate(td,num);
  } else {
    td.textContent=num;
    td.querySelector(".candidate")?.remove();
  }

  if(autoCandidateMode) updateAutoCandidates();
}

function clearNumber(){
  const td=document.querySelector(`td[data-row="${selectedRow}"][data-col="${selectedCol}"]`);
  if(td.classList.contains("fixed")) return;

  td.textContent="";
  td.querySelector(".candidate")?.remove();
  delete candidates[`${selectedRow}-${selectedCol}`];

  if(autoCandidateMode) updateAutoCandidates();
}

/* -------------------------------- MOVEMENT -------------------------------- */

function moveSelection(dir){
  let r=selectedRow, c=selectedCol;
  if(dir==="ArrowUp") r=(r+8)%9;
  if(dir==="ArrowDown") r=(r+1)%9;
  if(dir==="ArrowLeft") c=(c+8)%9;
  if(dir==="ArrowRight") c=(c+1)%9;
  selectCell(r,c);
}

/* -------------------------------- CANDIDATE MODE -------------------------------- */

function toggleCandidateMode(){
  candidateMode=!candidateMode;
  document.getElementById("candidateToggle").textContent =
    "Candidate Mode: " + (candidateMode ? "ON" : "OFF");
}

function toggleAutoCandidateMode(){
  autoCandidateMode=!autoCandidateMode;
  document.getElementById("autoCandidateBtn").textContent =
    "Auto Candidate Mode: " + (autoCandidateMode ? "ON" : "OFF");

  if(autoCandidateMode) updateAutoCandidates();
  else { candidates={}; updateCandidatesDisplay(); }
}

function toggleCandidate(td,num){
  const key=`${selectedRow}-${selectedCol}`;
  if(!candidates[key]) candidates[key]=new Set();
  candidates[key].has(num) ? candidates[key].delete(num) : candidates[key].add(num);
  td.querySelector(".candidate")?.remove();
  updateCandidatesDisplay();
}

/* -------------------------------- AUTO CANDIDATES -------------------------------- */

function updateAutoCandidates(){
  candidates={};

  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      const td=document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);

      if(!td.classList.contains("fixed") && td.textContent===""){
        const key=`${r}-${c}`;
        candidates[key]=new Set();

        for(let n=1;n<=9;n++){
          if(isValidMove(r,c,n)) candidates[key].add(n.toString());
        }
      }
    }
  }

  updateCandidatesDisplay();
}

function isValidMove(row,col,num){
  for(let x=0;x<9;x++){
    if(document.querySelector(`td[data-row="${row}"][data-col="${x}"]`).textContent==num) return false;
    if(document.querySelector(`td[data-row="${x}"][data-col="${col}"]`).textContent==num) return false;
  }

  const sr=row-row%3, sc=col-col%3;
  for(let i=0;i<3;i++){
    for(let j=0;j<3;j++){
      if(document.querySelector(`td[data-row="${sr+i}"][data-col="${sc+j}"]`).textContent==num) return false;
    }
  }
  return true;
}

function updateCandidatesDisplay(){
  document.querySelectorAll(".candidate").forEach(e => e.remove());

  for(const key in candidates){
    const [r,c]=key.split("-").map(Number);
    const td=document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);

    if(!td || td.textContent!=="") continue;

    const div=document.createElement("div");
    div.classList.add("candidate");

    for(let i=1;i<=9;i++){
      div.innerHTML += "<div>"+(candidates[key].has(i.toString())?i:"")+"</div>";
    }

    td.appendChild(div);
  }
}

/* -------------------------------- CHECK + HINT -------------------------------- */

function checkSolution(){
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      const td=document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);
      const val=td.textContent;

      if(val == solution[r][c]) td.style.background="#c8e6c9";
      else td.style.background="#ffcdd2";
    }
  }
}

function getHint(){
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      const td=document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);

      if(!td.classList.contains("fixed") && td.textContent===""){
        td.textContent = solution[r][c];
        td.querySelector(".candidate")?.remove();
        return;
      }
    }
  }
}

/* -------------------------------- GENERATOR -------------------------------- */

function generateSudoku(){
  let grid = Array.from({length:9},()=>Array(9).fill(0));
  fillGrid(grid);
  return grid;
}

function fillGrid(grid){
  for(let row=0;row<9;row++){
    for(let col=0;col<9;col++){
      if(grid[row][col]===0){
        let nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-0.5);
        for(let num of nums){
          if(valid(grid,row,col,num)){
            grid[row][col]=num;
            if(fillGrid(grid)) return true;
            grid[row][col]=0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

function valid(grid,row,col,num){
  for(let x=0;x<9;x++){
    if(grid[row][x]===num) return false;
    if(grid[x][col]===num) return false;
  }

  let sr=row-row%3, sc=col-col%3;
  for(let r=0;r<3;r++){
    for(let c=0;c<3;c++){
      if(grid[sr+r][sc+c]===num) return false;
    }
  }

  return true;
}

function removeCells(grid, count){
  let puzzle = grid.map(r=>r.slice());
  let removed=0;

  while(removed<count){
    let r=Math.floor(Math.random()*9);
    let c=Math.floor(Math.random()*9);

    if(puzzle[r][c] !== null){
      puzzle[r][c] = null;
      removed++;
    }
  }

  return puzzle;
}

</script>
</body>
</html>
