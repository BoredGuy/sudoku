<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Sudoku — Minified Swiss/Bauhaus</title><style>
:root{--bg:#f7f7f7;--fg:#111;--muted:#555;--accent:#111;--blue:#d9f0f0;--yellow:#fce5b3;--green:#c8e6c9;--red:#ffcdd2;--cell:52px}
*{box-sizing:border-box}body{font-family:"Helvetica Neue",Arial,sans-serif;margin:0;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;padding:22px}h1{font-weight:700;margin:0 0 12px;font-size:28px;letter-spacing:1px}
#top{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.controls{display:flex;gap:10px;align-items:center}
label{font-weight:600}select{padding:8px 10px;font-size:14px;border:2px solid var(--accent);background:#fff;color:var(--fg)}
button{background:var(--accent);color:#fff;border:0;padding:8px 12px;font-size:13px;cursor:pointer;text-transform:uppercase;letter-spacing:.6px}
button[hidden]{display:none}button:focus{outline:3px solid #000;outline-offset:2px}
.info{display:flex;gap:12px;align-items:center;font-weight:600;font-size:14px}
.badge{padding:6px 10px;border:2px solid var(--accent);background:#fff;font-weight:700}
.board{width:100%;max-width:calc(var(--cell)*9);display:flex;flex-direction:column;align-items:center}
table{border-collapse:collapse;margin-top:18px;background:#fff;display:none}
td{width:var(--cell);height:var(--cell);border:1px solid var(--accent);text-align:center;vertical-align:middle;font-size:20px;position:relative;cursor:pointer;user-select:none;padding:0;font-weight:500}
td.fixed{font-weight:700}td.selected{background:var(--blue)}td.clue-selected{background:var(--yellow)}td.correct{background:var(--green)}td.incorrect{background:var(--red)}
td:nth-child(3n){border-right:2px solid var(--accent)}tr:nth-child(3n) td{border-bottom:2px solid var(--accent)}
.cand{position:absolute;inset:4px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:11px;color:var(--muted)}
.cand div{display:flex;align-items:center;justify-content:center}
#controls-row{display:none;gap:8px;margin-top:12px}
@media(max-width:640px){:root{--cell:40px}}
</style></head><body>
<h1>Sudoku</h1>
<div id="top">
  <div class="controls">
    <div id="difficultyContainer"><label>Difficulty: <select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label></div>
    <button id="startBtn">Start New Game</button>
    <button id="candidateToggle" hidden>Candidate Mode: OFF</button>
    <button id="autoToggle" hidden>Auto Candidates: OFF</button>
  </div>
  <div class="info"><div id="timer" class="badge" hidden>Time: 00:00</div><div id="diffDisplay" class="badge small" hidden>Difficulty: Medium</div></div>
</div>

<div class="board">
  <table id="grid"></table>
  <div id="controls-row"><button id="checkBtn" hidden>Check</button><button id="hintBtn" hidden>Hint</button></div>
</div>

<script>
/* Minified but fully functional Sudoku with fixed candidate handling */
let puzzle=[],solution=[],selR=0,selC=0,ti=null,sec=0,candidateMode=false,autoMode=false,candidates={},diff='medium';
const $=(q)=>document.querySelector(q), $$=(q)=>Array.from(document.querySelectorAll(q));
function startTimer(){clearInterval(ti);sec=0;$('#timer').textContent='Time: 00:00';ti=setInterval(()=>{sec++;let m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');$('#timer').textContent=`Time: ${m}:${s}`},1000)}
function startGame(){
  $('#startBtn').hidden=true;$('#difficultyContainer').hidden=true;
  $('#timer').hidden=false;$('#diffDisplay').hidden=false;$('#grid').style.display='table';
  $('#candidateToggle').hidden=false;$('#autoToggle').hidden=false;$('#checkBtn').hidden=false;$('#hintBtn').hidden=false;$('#controls-row').style.display='flex';
  diff=$('#difficulty').value;$('#diffDisplay').textContent='Difficulty: '+(diff.charAt(0).toUpperCase()+diff.slice(1));
  const empty = diff==='easy'?30:diff==='medium'?40:50;
  const board = generate(); solution = board.map(r=>r.slice()); puzzle=remove(board,empty); candidates={};
  render(); startTimer(); selectCell(0,0); if(autoMode) updateAuto();
}
$('#startBtn').addEventListener('click',startGame);
$('#candidateToggle').addEventListener('click',()=>{candidateMode=!candidateMode;$('#candidateToggle').textContent=`Candidate Mode: ${candidateMode?'ON':'OFF'}`});
$('#autoToggle').addEventListener('click',()=>{autoMode=!autoMode;$('#autoToggle').textContent=`Auto Candidates: ${autoMode?'ON':'OFF'}`; if(autoMode) updateAuto(); else {candidates={}; updateDisplay()}});
$('#checkBtn').addEventListener('click',checkSolution);$('#hintBtn').addEventListener('click',getHint);

/* render */
function render(){
  const grid=$('#grid');grid.innerHTML='';for(let r=0;r<9;r++){const tr=document.createElement('tr');for(let c=0;c<9;c++){const td=document.createElement('td');td.dataset.row=r;td.dataset.col=c;if(puzzle[r][c]!==null){td.textContent=puzzle[r][c];td.classList.add('fixed')}td.addEventListener('click',()=>selectCell(r,c));tr.appendChild(td)}grid.appendChild(tr)}updateDisplay()
}
function selectCell(r,c){$$('td.selected, td.clue-selected').forEach(t=>t.classList.remove('selected','clue-selected'));const td=document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);if(!td) return; td.classList.contains('fixed')?td.classList.add('clue-selected'):td.classList.add('selected'); selR=r; selC=c;}

/* keyboard */
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '){e.preventDefault(); candidateMode=!candidateMode;$('#candidateToggle').textContent=`Candidate Mode: ${candidateMode?'ON':'OFF'}`; return}
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){e.preventDefault(); move(k); return}
  if(k>='1'&&k<='9'){place(k); return}
  if(['Backspace','Delete','0'].includes(k)){clearCell(); return}
});
function move(d){let r=selR,c=selC; if(d==='ArrowUp') r=(r+8)%9; if(d==='ArrowDown') r=(r+1)%9; if(d==='ArrowLeft') c=(c+8)%9; if(d==='ArrowRight') c=(c+1)%9; selectCell(r,c)}
function place(n){
  const td=document.querySelector(`td[data-row="${selR}"][data-col="${selC}"]`); if(!td||td.classList.contains('fixed')) return;
  if(candidateMode){ toggleCandidate(selR,selC,n); return }
  td.textContent = n;
  td.querySelector('.cand')?.remove();
  delete candidates[`${selR}-${selC}`];
  if(autoMode) updateAuto();
}
function clearCell(){
  const td=document.querySelector(`td[data-row="${selR}"][data-col="${selC}"]`); if(!td||td.classList.contains('fixed')) return;
  td.textContent=''; td.querySelector('.cand')?.remove(); delete candidates[`${selR}-${selC}`]; if(autoMode) updateAuto();
}

/* manual candidate toggle */
function toggleCandidate(r,c,n){
  const key=`${r}-${c}`; if(!candidates[key]) candidates[key]=new Set();
  candidates[key].has(n)?candidates[key].delete(n):candidates[key].add(n);
  // ensure main digit remains empty when adding candidates
  const td=document.querySelector(`td[data-row="${r}"][data-col="${c}"]`); td.textContent=''; updateDisplay();
}

/* auto candidates: compute possible numbers without overwriting digits */
function updateAuto(){
  candidates={};
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      const td=document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);
      if(!td) continue;
      if(td.classList.contains('fixed')) continue;
      if(td.textContent && td.textContent.trim()!=='') continue; // preserve entered digit
      const key=`${r}-${c}`; candidates[key]=new Set();
      for(let n=1;n<=9;n++) if(isValid(r,c,n)) candidates[key].add(String(n));
    }
  }
  updateDisplay();
}

/* display candidates only for empty cells; do not clear digits */
function updateDisplay(){
  // remove existing candidate elements
  $$('.cand').forEach(e=>e.remove());
  for(const k in candidates){
    const [r,c]=k.split('-').map(Number); const td=document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);
    if(!td) continue; if(td.textContent && td.textContent.trim()!=='') continue; // show only if empty
    const div=document.createElement('div'); div.className='cand';
    for(let i=1;i<=9;i++) div.innerHTML += `<div>${candidates[k].has(String(i))?i:''}</div>`;
    td.appendChild(div);
  }
}

/* isValid for candidates based on current grid */
function isValid(r,c,n){
  n=String(n);
  for(let x=0;x<9;x++){
    const rv=document.querySelector(`td[data-row="${r}"][data-col="${x}"]`)?.textContent;
    const cv=document.querySelector(`td[data-row="${x}"][data-col="${c}"]`)?.textContent;
    if(rv==n||cv==n) return false;
  }
  const sr=r-r%3, sc=c-c%3;
  for(let i=0;i<3;i++) for(let j=0;j<3;j++){
    const bv=document.querySelector(`td[data-row="${sr+i}"][data-col="${sc+j}"]`)?.textContent;
    if(bv==n) return false;
  }
  return true;
}

/* check & hint */
function checkSolution(){ for(let r=0;r<9;r++) for(let c=0;c<9;c++){ const td=document.querySelector(`td[data-row="${r}"][data-col="${c}"]`); const val=td.textContent; if(val==solution[r][c]) td.classList.add('correct'); else if(!td.classList.contains('fixed')) td.classList.add('incorrect'); } }
function getHint(){ for(let r=0;r<9;r++) for(let c=0;c<9;c++){ const td=document.querySelector(`td[data-row="${r}"][data-col="${c}"]`); if(!td.classList.contains('fixed') && (!td.textContent||td.textContent.trim()==='')){ td.textContent=solution[r][c]; td.querySelector('.cand')?.remove(); if(autoMode) updateAuto(); return } } }

/* generator (backtracking randomized) */
function generate(){
  const g=Array.from({length:9},()=>Array(9).fill(0));
  const valid=function(b,r,c,n){ for(let x=0;x<9;x++){ if(b[r][x]===n||b[x][c]===n) return false } const sr=r-r%3, sc=c-c%3; for(let i=0;i<3;i++) for(let j=0;j<3;j++) if(b[sr+i][sc+j]===n) return false; return true }
  function solve(b){
    for(let r=0;r<9;r++) for(let c=0;c<9;c++) if(b[r][c]===0){ const nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-0.5); for(const n of nums){ if(valid(b,r,c,n)){ b[r][c]=n; if(solve(b)) return true; b[r][c]=0 } } return false }
    return true
  }
  solve(g); return g;
}
function remove(board,count){ const p=board.map(r=>r.slice()); let rem=count; while(rem>0){ const r=Math.floor(Math.random()*9), c=Math.floor(Math.random()*9); if(p[r][c]!==null){ p[r][c]=null; rem-- } } return p }

/* Expose check/hint buttons after start */
$('#checkBtn').addEventListener('click',checkSolution); $('#hintBtn').addEventListener('click',getHint);

/* Ensure UI elements are shown/hidden when needed (start handles most) */
</script>
</body></html>
