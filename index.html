<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f7f7f5">
<title>Sudoku</title>

<style>
    :root {
        --paper: #f7f7f5;
        --paper-alt: #eeeeeb;
        --ink: #111111;
        --muted: #666666;
        --rule: #b7b7b3;
        --heavy-rule: #111111;

        --selected: #dce8f4;
        --related: #eeeeeb;

        --given-background: #d2d2cf;
        --given-text: #111111;

        --given-selected: #7899b8;
        --given-selected-text: #ffffff;

        --user: #315f8c;
        --conflict: #a52a2a;
        --candidate: #686868;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
    }

    body {
        font-family:
            Georgia,
            "Times New Roman",
            Times,
            serif;

        min-height: 100dvh;
        display: flex;
        justify-content: center;
        padding: 22px 16px;
    }

    button {
        font: inherit;
    }

    .app {
        width: min(100%, 640px);
        display: flex;
        flex-direction: column;
    }

    /* -----------------------------------------------------
       Masthead
       ----------------------------------------------------- */

    .masthead {
        border-top: 3px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        padding: 9px 0 8px;
        margin-bottom: 18px;
    }

    .masthead-inner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
    }

    .brand {
        font-size: clamp(2.2rem, 9vw, 4rem);
        line-height: .86;
        font-weight: normal;
        letter-spacing: -.07em;
    }

    /* -----------------------------------------------------
       Game header
       ----------------------------------------------------- */

    .game-heading {
        border-bottom: 1px solid var(--rule);
        padding-bottom: 13px;
        margin-bottom: 14px;
    }

    .heading-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
    }

    .game-meta {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-left: auto;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size: .7rem;
        text-transform: uppercase;
        letter-spacing: .08em;
        white-space: nowrap;
    }

    #difficultyDisplay {
        font-weight: 700;
    }

    #timer {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }

    /* -----------------------------------------------------
       Sudoku board
       ----------------------------------------------------- */

    .board-wrap {
        width: 100%;
        aspect-ratio: 1;
        border: 1.5px solid var(--heavy-rule);
        background: var(--heavy-rule);
    }

    #board {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        grid-template-rows: repeat(9, 1fr);
        gap: 1px;
        background: var(--heavy-rule);
    }

    .cell {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: var(--paper);
        cursor: pointer;
        user-select: none;
        outline: none;
    }

    .cell.related {
        background: var(--related);
    }

    .cell.selected {
        background: var(--selected);
    }

    /* Pre-filled cells always remain light grey. */
    .cell.given,
    .cell.given.related {
        background: var(--given-background);
    }

    /* Selected pre-filled cell is darker blue. */
    .cell.given.selected {
        background: var(--given-selected);
    }

    .cell:nth-child(3n):not(:nth-child(9n)) {
        border-right: 2px solid var(--heavy-rule);
    }

    .cell:nth-child(n + 19):nth-child(-n + 27),
    .cell:nth-child(n + 46):nth-child(-n + 54) {
        border-bottom: 2px solid var(--heavy-rule);
    }

    .value {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;

        font-family:
            Georgia,
            "Times New Roman",
            Times,
            serif;

        font-size: clamp(1.45rem, 7vw, 2.55rem);
        line-height: 1;
    }

    .cell.given .value {
        color: var(--given-text);
        font-weight: 700;
    }

    .cell.given.selected .value {
        color: var(--given-selected-text);
    }

    .cell.user .value {
        color: var(--user);
        font-weight: normal;
    }

    .cell.conflict .value {
        color: var(--conflict);
    }

    .cell.given.selected.conflict .value {
        color: var(--conflict);
    }

    /* -----------------------------------------------------
       Pencil marks
       ----------------------------------------------------- */

    .candidates {
        position: absolute;
        inset: 5%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        pointer-events: none;
    }

    .candidate {
        display: flex;
        align-items: center;
        justify-content: center;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        color: var(--candidate);
        font-size: clamp(.45rem, 2.1vw, .72rem);
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }

    .candidate.conflict {
        color: var(--conflict);
        font-weight: 700;
    }

    /* -----------------------------------------------------
       Controls
       ----------------------------------------------------- */

    .controls {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        margin-top: 15px;
    }

    .control-button {
        min-height: 47px;
        border: 0;
        border-right: 1px solid var(--rule);
        background: transparent;
        color: var(--ink);
        cursor: pointer;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size: .68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
    }

    .control-button:last-child {
        border-right: 0;
    }

    .control-button:hover,
    .control-button.active {
        background: var(--ink);
        color: #fff;
    }

    .control-button:focus-visible,
    .difficulty-button:focus-visible,
    #startButton:focus-visible,
    #continueButton:focus-visible,
    .completion-actions button:focus-visible {
        outline: 2px solid var(--user);
        outline-offset: -2px;
    }

    /* -----------------------------------------------------
       Footer
       ----------------------------------------------------- */

    .footer {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding-top: 9px;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        color: var(--muted);
        font-size: .61rem;
        line-height: 1.4;
        text-transform: uppercase;
        letter-spacing: .05em;
    }

    /* -----------------------------------------------------
       Start screen
       ----------------------------------------------------- */

    .start-screen {
        position: fixed;
        inset: 0;
        z-index: 10;

        background: var(--paper);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;
    }

    .start-content {
        width: min(100%, 430px);
        text-align: center;
    }

    .start-content h2 {
        margin: 0 0 28px;

        font-size: clamp(3.5rem, 17vw, 6rem);
        line-height: .82;
        font-weight: normal;
        letter-spacing: -.08em;
    }

    .difficulty-picker {
        display: grid;
        grid-template-columns: repeat(3, 1fr);

        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);

        margin-bottom: 13px;
    }

    .difficulty-button {
        min-height: 48px;
        border: 0;
        border-right: 1px solid var(--rule);

        background: transparent;
        color: var(--ink);
        cursor: pointer;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size: .68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .difficulty-button:last-child {
        border-right: 0;
    }

    .difficulty-button.active {
        background: var(--ink);
        color: white;
    }

    .start-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
    }

    #startButton,
    #continueButton {
        width: 100%;
        min-height: 54px;

        border: 0;
        cursor: pointer;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size: .72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .1em;
    }

    #startButton {
        background: var(--ink);
        color: white;
    }

    #startButton:hover {
        background: #333;
    }

    #continueButton {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--ink);
    }

    #continueButton:hover {
        background: var(--ink);
        color: white;
    }

    /* -----------------------------------------------------
       Completion modal
       ----------------------------------------------------- */

    .completion-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;

        background: rgba(247, 247, 245, .95);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;
    }

    .completion {
        width: min(100%, 410px);

        background: var(--paper);

        border-top: 3px solid var(--ink);
        border-bottom: 1px solid var(--ink);

        padding: 25px 22px 22px;
        text-align: center;
    }

    .completion-kicker {
        margin-bottom: 8px;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size: .63rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .12em;
    }

    .completion h2 {
        margin: 0 0 9px;

        font-size: 3rem;
        line-height: .9;
        font-weight: normal;
        letter-spacing: -.06em;
    }

    .completion p {
        margin: 0 0 23px;
        font-size: .95rem;
        color: var(--muted);
    }

    .completion strong {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
    }

    .completion-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;

        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
    }

    .completion-actions button {
        min-height: 48px;
        border: 0;
        border-right: 1px solid var(--rule);

        cursor: pointer;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        font-size: .68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .07em;
    }

    .completion-actions button:last-child {
        border-right: 0;
    }

    #newGameButton {
        background: var(--ink);
        color: white;
    }

    #closeCompletionButton {
        background: transparent;
        color: var(--ink);
    }

    .hidden {
        display: none !important;
    }

    /* -----------------------------------------------------
       Mobile
       ----------------------------------------------------- */

    @media (max-width: 480px) {
        body {
            padding: 12px 10px;
            align-items: flex-start;
        }

        .app {
            width: 100%;
        }

        .masthead {
            margin-bottom: 12px;
        }

        .brand {
            font-size: 2.45rem;
        }

        .game-heading {
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .heading-row {
            align-items: center;
        }

        .game-meta {
            gap: 9px;
            font-size: .59rem;
        }

        .controls {
            grid-template-columns: 1fr 1fr;
        }

        .control-button:nth-child(3),
        .control-button:nth-child(4) {
            border-top: 1px solid var(--rule);
        }

        .control-button:nth-child(2),
        .control-button:nth-child(4) {
            border-right: 0;
        }

        .footer {
            font-size: .55rem;
        }
    }

    @media (max-height: 700px) and (min-width: 481px) {
        body {
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .masthead {
            margin-bottom: 10px;
        }

        .game-heading {
            margin-bottom: 8px;
            padding-bottom: 8px;
        }

        .controls {
            margin-top: 9px;
        }
    }
</style>
</head>

<body>

<!-- =======================================================
     START SCREEN
     ======================================================== -->

<div id="startScreen" class="start-screen">
    <div class="start-content">

        <h2>Sudoku</h2>

        <div class="difficulty-picker">
            <button
                class="difficulty-button active"
                data-difficulty="easy">
                Easy
            </button>

            <button
                class="difficulty-button"
                data-difficulty="medium">
                Medium
            </button>

            <button
                class="difficulty-button"
                data-difficulty="hard">
                Hard
            </button>
        </div>

        <div class="start-actions">

            <button id="startButton">
                Start Game
            </button>

            <button
                id="continueButton"
                class="hidden">
                Continue
            </button>

        </div>

    </div>
</div>


<!-- =======================================================
     GAME
     ======================================================== -->

<main class="app">

    <header class="masthead">
        <div class="masthead-inner">
            <div class="brand">Sudoku</div>
        </div>
    </header>

    <section class="game-heading">
        <div class="heading-row">

            <div class="game-meta">
                <span id="difficultyDisplay">
                    EASY
                </span>

                <span id="timer">
                    00:00
                </span>
            </div>

        </div>
    </section>

    <section
        class="board-wrap"
        aria-label="Sudoku board">

        <div
            id="board"
            role="grid"
            aria-label="Sudoku puzzle">
        </div>

    </section>

    <section class="controls">

        <button
            id="pencilButton"
            class="control-button">
            Pencil: OFF
        </button>

        <button
            id="autoCandidateButton"
            class="control-button">
            Auto Candidates: OFF
        </button>

        <button
            id="resetButton"
            class="control-button">
            Reset
        </button>

        <button
            id="newGameControl"
            class="control-button">
            New Game
        </button>

    </section>

    <footer class="footer">
        <span>
            1–9 Enter Number
        </span>

        <span>
            Space Pencil
        </span>

        <span>
            ← ↑ ↓ → Navigate
        </span>
    </footer>

</main>


<!-- =======================================================
     COMPLETION
     ======================================================== -->

<div
    id="completionOverlay"
    class="completion-overlay hidden">

    <div class="completion">

        <div class="completion-kicker">
            Puzzle Solved
        </div>

        <h2>Complete</h2>

        <p>
            Solved in
            <strong id="completionTime">
                00:00
            </strong>.
        </p>

        <div class="completion-actions">

            <button id="newGameButton">
                New Game
            </button>

            <button id="closeCompletionButton">
                Close
            </button>

        </div>

    </div>

</div>


<script>
"use strict";


/* =========================================================
   Constants
   ========================================================= */

const SIZE = 9;
const BOX = 3;

const STORAGE_KEY =
    "sudoku-active-game-v1";

const SAVE_INTERVAL_SECONDS = 5;


/* =========================================================
   State
   ========================================================= */

const state = {
    solution: [],
    puzzle: [],
    board: [],
    candidates: [],

    selected: 0,

    difficulty: "easy",

    pencilMode: false,
    autoCandidates: false,

    running: false,
    completed: false,

    elapsedSeconds: 0,
    timerInterval: null,

    secondsSinceSave: 0
};


/* =========================================================
   Difficulty
   ========================================================= */

const difficultyConfig = {
    easy: {
        clues: 42
    },

    medium: {
        clues: 34
    },

    hard: {
        clues: 28
    }
};


/* =========================================================
   DOM
   ========================================================= */

const boardElement =
    document.getElementById(
        "board"
    );

const timerElement =
    document.getElementById(
        "timer"
    );

const difficultyDisplay =
    document.getElementById(
        "difficultyDisplay"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const continueButton =
    document.getElementById(
        "continueButton"
    );

const pencilButton =
    document.getElementById(
        "pencilButton"
    );

const autoCandidateButton =
    document.getElementById(
        "autoCandidateButton"
    );

const resetButton =
    document.getElementById(
        "resetButton"
    );

const newGameControl =
    document.getElementById(
        "newGameControl"
    );

const completionOverlay =
    document.getElementById(
        "completionOverlay"
    );

const completionTime =
    document.getElementById(
        "completionTime"
    );

const newGameButton =
    document.getElementById(
        "newGameButton"
    );

const closeCompletionButton =
    document.getElementById(
        "closeCompletionButton"
    );

const difficultyButtons =
    document.querySelectorAll(
        ".difficulty-button"
    );


/* =========================================================
   Utilities
   ========================================================= */

function shuffle(array) {
    const result = array.slice();

    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {
        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];
    }

    return result;
}


function createEmptyGrid() {
    return Array.from(
        { length: SIZE },
        () => Array(SIZE).fill(0)
    );
}


function cloneGrid(grid) {
    return grid.map(
        row => row.slice()
    );
}


function createEmptyCandidates() {
    return Array.from(
        { length: SIZE },
        () =>
            Array.from(
                { length: SIZE },
                () => []
            )
    );
}


function formatTime(seconds) {
    const minutes =
        Math.floor(seconds / 60);

    const secs =
        seconds % 60;

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}


function indexToRowCol(index) {
    return [
        Math.floor(index / SIZE),
        index % SIZE
    ];
}


function rowColToIndex(row, col) {
    return row * SIZE + col;
}


/* =========================================================
   Persistence
   ========================================================= */

function saveGame() {
    if (
        !state.running ||
        state.completed ||
        state.puzzle.length !== SIZE
    ) {
        return;
    }

    const savedGame = {
        version: 1,

        solution: cloneGrid(
            state.solution
        ),

        puzzle: cloneGrid(
            state.puzzle
        ),

        board: cloneGrid(
            state.board
        ),

        candidates:
            state.candidates.map(
                row =>
                    row.map(
                        cell =>
                            Array.isArray(cell)
                                ? cell.slice()
                                : []
                    )
            ),

        selected: state.selected,

        difficulty: state.difficulty,

        pencilMode:
            state.pencilMode,

        autoCandidates:
            state.autoCandidates,

        elapsedSeconds:
            state.elapsedSeconds
    };

    try {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(savedGame)
        );
    } catch (error) {
        /*
         * Storage may be unavailable.
         * The game continues to work without it.
         */
    }

    state.secondsSinceSave = 0;
}


function clearSavedGame() {
    try {
        localStorage.removeItem(
            STORAGE_KEY
        );
    } catch (error) {
        /*
         * Ignore storage errors.
         */
    }
}


function isValidGrid(grid) {
    if (
        !Array.isArray(grid) ||
        grid.length !== SIZE
    ) {
        return false;
    }

    return grid.every(row =>
        Array.isArray(row) &&
        row.length === SIZE &&
        row.every(
            value =>
                Number.isInteger(value) &&
                value >= 0 &&
                value <= 9
        )
    );
}


function isValidCandidates(candidates) {
    if (
        !Array.isArray(candidates) ||
        candidates.length !== SIZE
    ) {
        return false;
    }

    return candidates.every(row =>
        Array.isArray(row) &&
        row.length === SIZE &&
        row.every(cell =>
            Array.isArray(cell) &&
            cell.every(
                value =>
                    Number.isInteger(value) &&
                    value >= 1 &&
                    value <= 9
            )
        )
    );
}


/*
 * Read and validate the saved game without
 * automatically starting it.
 *
 * This is important because every page load
 * must show the start screen first.
 */
function readSavedGame() {
    let savedGame = null;

    try {
        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!raw) {
            return null;
        }

        savedGame =
            JSON.parse(raw);
    } catch (error) {
        clearSavedGame();
        return null;
    }

    if (
        !savedGame ||
        savedGame.version !== 1 ||
        !isValidGrid(
            savedGame.solution
        ) ||
        !isValidGrid(
            savedGame.puzzle
        ) ||
        !isValidGrid(
            savedGame.board
        ) ||
        !isValidCandidates(
            savedGame.candidates
        ) ||
        ![
            "easy",
            "medium",
            "hard"
        ].includes(
            savedGame.difficulty
        ) ||
        !Number.isInteger(
            savedGame.selected
        ) ||
        savedGame.selected < 0 ||
        savedGame.selected > 80 ||
        !Number.isInteger(
            savedGame.elapsedSeconds
        ) ||
        savedGame.elapsedSeconds < 0 ||
        typeof savedGame.pencilMode !==
            "boolean" ||
        typeof savedGame.autoCandidates !==
            "boolean"
    ) {
        clearSavedGame();
        return null;
    }

    return savedGame;
}


/*
 * Show or hide the Continue button based on
 * whether a valid saved game exists.
 */
function updateContinueButton() {
    const savedGame =
        readSavedGame();

    continueButton.classList.toggle(
        "hidden",
        savedGame === null
    );
}


/*
 * Restore the saved game into the live state.
 * This function does NOT generate a new puzzle.
 */
function continueSavedGame() {
    const savedGame =
        readSavedGame();

    if (!savedGame) {
        updateContinueButton();
        return;
    }

    stopTimer();

    state.solution =
        cloneGrid(
            savedGame.solution
        );

    state.puzzle =
        cloneGrid(
            savedGame.puzzle
        );

    state.board =
        cloneGrid(
            savedGame.board
        );

    state.candidates =
        savedGame.candidates.map(
            row =>
                row.map(
                    cell =>
                        cell.slice()
                )
        );

    state.selected =
        savedGame.selected;

    state.difficulty =
        savedGame.difficulty;

    state.pencilMode =
        savedGame.pencilMode;

    state.autoCandidates =
        savedGame.autoCandidates;

    state.elapsedSeconds =
        savedGame.elapsedSeconds;

    state.secondsSinceSave = 0;

    state.running = true;
    state.completed = false;

    /*
     * Automatic candidates are derived from the
     * current board and therefore recalculated
     * when the game is restored.
     */
    if (
        state.autoCandidates
    ) {
        updateAllCandidates();
    }

    selectDifficulty(
        state.difficulty
    );

    timerElement.textContent =
        formatTime(
            state.elapsedSeconds
        );

    completionOverlay.classList.add(
        "hidden"
    );

    startScreen.classList.add(
        "hidden"
    );

    renderBoard();
    startTimer();
}


/* =========================================================
   Sudoku generation
   ========================================================= */

function isValidPlacement(
    grid,
    row,
    col,
    number
) {
    for (
        let c = 0;
        c < SIZE;
        c++
    ) {
        if (
            grid[row][c] === number
        ) {
            return false;
        }
    }

    for (
        let r = 0;
        r < SIZE;
        r++
    ) {
        if (
            grid[r][col] === number
        ) {
            return false;
        }
    }

    const startRow =
        Math.floor(row / BOX) * BOX;

    const startCol =
        Math.floor(col / BOX) * BOX;

    for (
        let r = startRow;
        r < startRow + BOX;
        r++
    ) {
        for (
            let c = startCol;
            c < startCol + BOX;
            c++
        ) {
            if (
                grid[r][c] === number
            ) {
                return false;
            }
        }
    }

    return true;
}


function solveGrid(grid) {
    let bestRow = -1;
    let bestCol = -1;
    let bestCandidates = null;

    for (
        let row = 0;
        row < SIZE;
        row++
    ) {
        for (
            let col = 0;
            col < SIZE;
            col++
        ) {
            if (
                grid[row][col] !== 0
            ) {
                continue;
            }

            const candidates = [];

            for (
                let number = 1;
                number <= 9;
                number++
            ) {
                if (
                    isValidPlacement(
                        grid,
                        row,
                        col,
                        number
                    )
                ) {
                    candidates.push(
                        number
                    );
                }
            }

            if (
                candidates.length === 0
            ) {
                return false;
            }

            if (
                bestCandidates === null ||
                candidates.length <
                    bestCandidates.length
            ) {
                bestCandidates =
                    candidates;

                bestRow = row;
                bestCol = col;

                if (
                    candidates.length === 1
                ) {
                    break;
                }
            }
        }

        if (
            bestCandidates &&
            bestCandidates.length === 1
        ) {
            break;
        }
    }

    if (
        bestCandidates === null
    ) {
        return true;
    }

    for (
        const number of
        shuffle(bestCandidates)
    ) {
        grid[bestRow][bestCol] =
            number;

        if (
            solveGrid(grid)
        ) {
            return true;
        }

        grid[bestRow][bestCol] = 0;
    }

    return false;
}


function generateSolution() {
    const grid =
        createEmptyGrid();

    solveGrid(grid);

    return grid;
}


function countSolutions(
    grid,
    limit = 2
) {
    let bestRow = -1;
    let bestCol = -1;
    let bestCandidates = null;

    for (
        let row = 0;
        row < SIZE;
        row++
    ) {
        for (
            let col = 0;
            col < SIZE;
            col++
        ) {
            if (
                grid[row][col] !== 0
            ) {
                continue;
            }

            const candidates = [];

            for (
                let number = 1;
                number <= 9;
                number++
            ) {
                if (
                    isValidPlacement(
                        grid,
                        row,
                        col,
                        number
                    )
                ) {
                    candidates.push(
                        number
                    );
                }
            }

            if (
                candidates.length === 0
            ) {
                return 0;
            }

            if (
                bestCandidates === null ||
                candidates.length <
                    bestCandidates.length
            ) {
                bestCandidates =
                    candidates;

                bestRow = row;
                bestCol = col;
            }
        }
    }

    if (
        bestCandidates === null
    ) {
        return 1;
    }

    let count = 0;

    for (
        const number of
        bestCandidates
    ) {
        grid[bestRow][bestCol] =
            number;

        count += countSolutions(
            grid,
            limit - count
        );

        grid[bestRow][bestCol] = 0;

        if (
            count >= limit
        ) {
            return count;
        }
    }

    return count;
}


function generatePuzzle(
    solution,
    clueCount
) {
    const puzzle =
        cloneGrid(solution);

    const positions =
        shuffle(
            Array.from(
                { length: 81 },
                (_, i) => i
            )
        );

    let clues = 81;

    for (
        const index of positions
    ) {
        if (
            clues <= clueCount
        ) {
            break;
        }

        const [row, col] =
            indexToRowCol(index);

        const previous =
            puzzle[row][col];

        puzzle[row][col] = 0;

        const testGrid =
            cloneGrid(puzzle);

        if (
            countSolutions(
                testGrid,
                2
            ) !== 1
        ) {
            puzzle[row][col] =
                previous;
        } else {
            clues--;
        }
    }

    return puzzle;
}


/* =========================================================
   Candidates
   ========================================================= */

function getCandidates(
    row,
    col
) {
    if (
        state.board[row][col] !== 0
    ) {
        return [];
    }

    const candidates = [];

    for (
        let number = 1;
        number <= 9;
        number++
    ) {
        if (
            isValidPlacement(
                state.board,
                row,
                col,
                number
            )
        ) {
            candidates.push(number);
        }
    }

    return candidates;
}


function updateAllCandidates() {
    for (
        let row = 0;
        row < SIZE;
        row++
    ) {
        for (
            let col = 0;
            col < SIZE;
            col++
        ) {
            if (
                state.board[row][col] !== 0
            ) {
                continue;
            }

            if (
                state.autoCandidates
            ) {
                state.candidates[row][col] =
                    getCandidates(
                        row,
                        col
                    );
            }
        }
    }
}


/* =========================================================
   Conflict detection
   ========================================================= */

function getConflicts() {
    const conflicts = new Set();

    for (
        let row = 0;
        row < SIZE;
        row++
    ) {
        const seen = {};

        for (
            let col = 0;
            col < SIZE;
            col++
        ) {
            const value =
                state.board[row][col];

            if (!value) {
                continue;
            }

            if (
                seen[value] !== undefined
            ) {
                conflicts.add(
                    rowColToIndex(
                        row,
                        col
                    )
                );

                conflicts.add(
                    rowColToIndex(
                        row,
                        seen[value]
                    )
                );
            } else {
                seen[value] = col;
            }
        }
    }

    for (
        let col = 0;
        col < SIZE;
        col++
    ) {
        const seen = {};

        for (
            let row = 0;
            row < SIZE;
            row++
        ) {
            const value =
                state.board[row][col];

            if (!value) {
                continue;
            }

            if (
                seen[value] !== undefined
            ) {
                conflicts.add(
                    rowColToIndex(
                        row,
                        col
                    )
                );

                conflicts.add(
                    rowColToIndex(
                        seen[value],
                        col
                    )
                );
            } else {
                seen[value] = row;
            }
        }
    }

    for (
        let boxRow = 0;
        boxRow < 3;
        boxRow++
    ) {
        for (
            let boxCol = 0;
            boxCol < 3;
            boxCol++
        ) {
            const seen = {};

            for (
                let row =
                    boxRow * 3;
                row <
                    boxRow * 3 + 3;
                row++
            ) {
                for (
                    let col =
                        boxCol * 3;
                    col <
                        boxCol * 3 + 3;
                    col++
                ) {
                    const value =
                        state.board[row][col];

                    if (!value) {
                        continue;
                    }

                    const index =
                        rowColToIndex(
                            row,
                            col
                        );

                    if (
                        seen[value] !==
                        undefined
                    ) {
                        conflicts.add(index);
                        conflicts.add(
                            seen[value]
                        );
                    } else {
                        seen[value] = index;
                    }
                }
            }
        }
    }

    return conflicts;
}


/* =========================================================
   Rendering
   ========================================================= */

function renderBoard() {
    boardElement.innerHTML = "";

    const conflicts =
        getConflicts();

    const [
        selectedRow,
        selectedCol
    ] = indexToRowCol(
        state.selected
    );

    for (
        let index = 0;
        index < 81;
        index++
    ) {
        const [row, col] =
            indexToRowCol(index);

        const cell =
            document.createElement("div");

        cell.className = "cell";

        const value =
            state.board[row][col];

        const isGiven =
            state.puzzle[row][col] !== 0;

        if (isGiven) {
            cell.classList.add(
                "given"
            );
        } else if (value !== 0) {
            cell.classList.add(
                "user"
            );
        }

        const sameRow =
            row === selectedRow;

        const sameCol =
            col === selectedCol;

        const sameBox =
            Math.floor(row / 3) ===
                Math.floor(
                    selectedRow / 3
                ) &&
            Math.floor(col / 3) ===
                Math.floor(
                    selectedCol / 3
                );

        if (
            !isGiven &&
            (
                sameRow ||
                sameCol ||
                sameBox
            )
        ) {
            cell.classList.add(
                "related"
            );
        }

        if (
            index === state.selected
        ) {
            cell.classList.add(
                "selected"
            );
        }

        if (
            conflicts.has(index)
        ) {
            cell.classList.add(
                "conflict"
            );
        }

        if (value !== 0) {
            const valueElement =
                document.createElement(
                    "span"
                );

            valueElement.className =
                "value";

            valueElement.textContent =
                value;

            cell.appendChild(
                valueElement
            );
        } else {
            const candidatesElement =
                document.createElement(
                    "div"
                );

            candidatesElement.className =
                "candidates";

            const candidates =
                state.candidates[row][col] ||
                [];

            for (
                let number = 1;
                number <= 9;
                number++
            ) {
                const candidate =
                    document.createElement(
                        "span"
                    );

                candidate.className =
                    "candidate";

                if (
                    candidates.includes(number)
                ) {
                    candidate.textContent =
                        number;
                }

                candidatesElement.appendChild(
                    candidate
                );
            }

            cell.appendChild(
                candidatesElement
            );
        }

        cell.addEventListener(
            "click",
            () => {
                if (
                    !state.running ||
                    state.completed
                ) {
                    return;
                }

                state.selected =
                    index;

                renderBoard();
                saveGame();
            }
        );

        boardElement.appendChild(
            cell
        );
    }

    difficultyDisplay.textContent =
        state.difficulty.toUpperCase();

    pencilButton.textContent =
        `Pencil: ${
            state.pencilMode
                ? "ON"
                : "OFF"
        }`;

    pencilButton.classList.toggle(
        "active",
        state.pencilMode
    );

    autoCandidateButton.textContent =
        `Auto Candidates: ${
            state.autoCandidates
                ? "ON"
                : "OFF"
        }`;

    autoCandidateButton.classList.toggle(
        "active",
        state.autoCandidates
    );
}


/* =========================================================
   Input
   ========================================================= */

function placeNumber(number) {
    if (
        !state.running ||
        state.completed
    ) {
        return;
    }

    const [row, col] =
        indexToRowCol(
            state.selected
        );

    if (
        state.puzzle[row][col] !== 0
    ) {
        return;
    }

    if (
        !state.pencilMode
    ) {
        state.board[row][col] =
            number;

        state.candidates[row][col] =
            [];

        if (
            state.autoCandidates
        ) {
            updateAllCandidates();
        }

        renderBoard();
        saveGame();

        checkCompletion();

        return;
    }

    /*
     * Automatic Candidates controls the
     * candidate set automatically.
     */
    if (
        state.autoCandidates
    ) {
        return;
    }

    const current =
        state.candidates[row][col] || [];

    if (
        current.includes(number)
    ) {
        state.candidates[row][col] =
            current.filter(
                n => n !== number
            );
    } else {
        state.candidates[row][col] =
            [...current, number].sort();
    }

    renderBoard();
    saveGame();
}


function clearSelectedCell() {
    if (
        !state.running ||
        state.completed
    ) {
        return;
    }

    const [row, col] =
        indexToRowCol(
            state.selected
        );

    if (
        state.puzzle[row][col] !== 0
    ) {
        return;
    }

    state.board[row][col] = 0;

    if (
        state.autoCandidates
    ) {
        updateAllCandidates();
    }

    renderBoard();
    saveGame();
}


function togglePencilMode() {
    if (
        !state.running ||
        state.completed
    ) {
        return;
    }

    state.pencilMode =
        !state.pencilMode;

    renderBoard();
    saveGame();
}


function toggleAutoCandidates() {
    if (
        !state.running ||
        state.completed
    ) {
        return;
    }

    state.autoCandidates =
        !state.autoCandidates;

    if (
        state.autoCandidates
    ) {
        updateAllCandidates();
    }

    renderBoard();
    saveGame();
}


/* =========================================================
   Reset current puzzle
   ========================================================= */

function resetGame() {
    if (
        state.puzzle.length !== SIZE ||
        (
            !state.running &&
            !state.completed
        )
    ) {
        return;
    }

    stopTimer();

    state.board =
        cloneGrid(
            state.puzzle
        );

    state.candidates =
        createEmptyCandidates();

    state.selected = 0;
    state.pencilMode = false;
    state.autoCandidates = false;

    state.running = true;
    state.completed = false;

    state.elapsedSeconds = 0;
    state.secondsSinceSave = 0;

    timerElement.textContent =
        "00:00";

    completionOverlay.classList.add(
        "hidden"
    );

    startScreen.classList.add(
        "hidden"
    );

    renderBoard();
    saveGame();
    startTimer();
}


/* =========================================================
   Keyboard navigation
   ========================================================= */

function moveSelection(direction) {
    if (
        !state.running ||
        state.completed
    ) {
        return;
    }

    let [row, col] =
        indexToRowCol(
            state.selected
        );

    switch (direction) {
        case "up":
            row = (row + 8) % 9;
            break;

        case "down":
            row = (row + 1) % 9;
            break;

        case "left":
            col = (col + 8) % 9;
            break;

        case "right":
            col = (col + 1) % 9;
            break;
    }

    state.selected =
        rowColToIndex(
            row,
            col
        );

    renderBoard();
    saveGame();
}


document.addEventListener(
    "keydown",
    event => {
        if (
            !state.running ||
            state.completed
        ) {
            return;
        }

        if (
            event.key === " " ||
            event.code === "Space"
        ) {
            event.preventDefault();

            togglePencilMode();

            return;
        }

        switch (event.key) {
            case "ArrowUp":
                event.preventDefault();
                moveSelection("up");
                return;

            case "ArrowDown":
                event.preventDefault();
                moveSelection("down");
                return;

            case "ArrowLeft":
                event.preventDefault();
                moveSelection("left");
                return;

            case "ArrowRight":
                event.preventDefault();
                moveSelection("right");
                return;

            case "Backspace":
            case "Delete":
            case "0":
                event.preventDefault();
                clearSelectedCell();
                return;
        }

        if (
            event.key >= "1" &&
            event.key <= "9"
        ) {
            event.preventDefault();

            placeNumber(
                Number(event.key)
            );
        }
    }
);


/* =========================================================
   Completion
   ========================================================= */

function checkCompletion() {
    const conflicts =
        getConflicts();

    if (
        conflicts.size > 0
    ) {
        return;
    }

    for (
        let row = 0;
        row < SIZE;
        row++
    ) {
        for (
            let col = 0;
            col < SIZE;
            col++
        ) {
            if (
                state.board[row][col] === 0
            ) {
                return;
            }

            if (
                state.board[row][col] !==
                state.solution[row][col]
            ) {
                return;
            }
        }
    }

    completeGame();
}


function completeGame() {
    if (
        state.completed
    ) {
        return;
    }

    state.completed = true;
    state.running = false;

    stopTimer();

    /*
     * Completed games are not offered as
     * resumable games.
     */
    clearSavedGame();

    completionTime.textContent =
        formatTime(
            state.elapsedSeconds
        );

    completionOverlay.classList.remove(
        "hidden"
    );

    renderBoard();

    updateContinueButton();
}


/* =========================================================
   Timer
   ========================================================= */

function startTimer() {
    stopTimer();

    state.timerInterval =
        setInterval(() => {
            if (
                state.running &&
                !state.completed
            ) {
                state.elapsedSeconds++;
                state.secondsSinceSave++;

                timerElement.textContent =
                    formatTime(
                        state.elapsedSeconds
                    );

                if (
                    state.secondsSinceSave >=
                    SAVE_INTERVAL_SECONDS
                ) {
                    saveGame();
                }
            }
        }, 1000);
}


function stopTimer() {
    if (
        state.timerInterval !== null
    ) {
        clearInterval(
            state.timerInterval
        );

        state.timerInterval = null;
    }
}


/* =========================================================
   Start screen / New Game
   ========================================================= */

/*
 * The start screen is shown whenever the user
 * chooses New Game and also on every fresh
 * page load.
 */
function showStartScreen() {
    stopTimer();

    state.running = false;
    state.completed = false;

    completionOverlay.classList.add(
        "hidden"
    );

    startScreen.classList.remove(
        "hidden"
    );

    updateContinueButton();
}


/*
 * Start Game always creates a completely
 * new puzzle and replaces the saved game.
 */
function startGame() {
    const config =
        difficultyConfig[
            state.difficulty
        ];

    stopTimer();

    state.solution =
        generateSolution();

    state.puzzle =
        generatePuzzle(
            state.solution,
            config.clues
        );

    state.board =
        cloneGrid(
            state.puzzle
        );

    state.candidates =
        createEmptyCandidates();

    state.selected = 0;
    state.pencilMode = false;
    state.autoCandidates = false;

    state.running = true;
    state.completed = false;

    state.elapsedSeconds = 0;
    state.secondsSinceSave = 0;

    timerElement.textContent =
        "00:00";

    completionOverlay.classList.add(
        "hidden"
    );

    startScreen.classList.add(
        "hidden"
    );

    renderBoard();

    /*
     * Saving immediately ensures that even a
     * newly generated puzzle can be continued.
     */
    saveGame();

    startTimer();

    updateContinueButton();
}


/* =========================================================
   Difficulty
   ========================================================= */

function selectDifficulty(
    difficulty
) {
    state.difficulty =
        difficulty;

    difficultyButtons.forEach(
        button => {
            button.classList.toggle(
                "active",
                button.dataset.difficulty ===
                    difficulty
            );
        }
    );
}


/* =========================================================
   UI Events
   ========================================================= */

difficultyButtons.forEach(
    button => {
        button.addEventListener(
            "click",
            () => {
                selectDifficulty(
                    button.dataset.difficulty
                );
            }
        );
    }
);


startButton.addEventListener(
    "click",
    startGame
);


continueButton.addEventListener(
    "click",
    continueSavedGame
);


pencilButton.addEventListener(
    "click",
    togglePencilMode
);


autoCandidateButton.addEventListener(
    "click",
    toggleAutoCandidates
);


resetButton.addEventListener(
    "click",
    resetGame
);


newGameControl.addEventListener(
    "click",
    showStartScreen
);


newGameButton.addEventListener(
    "click",
    showStartScreen
);


closeCompletionButton.addEventListener(
    "click",
    () => {
        completionOverlay.classList.add(
            "hidden"
        );
    }
);


/* =========================================================
   Save when the page is backgrounded or closed
   ========================================================= */

window.addEventListener(
    "pagehide",
    () => {
        saveGame();
    }
);


document.addEventListener(
    "visibilitychange",
    () => {
        if (
            document.visibilityState ===
                "hidden"
        ) {
            saveGame();
        }
    }
);


/* =========================================================
   Initial startup
   ========================================================= */

/*
 * Initialize an empty board for the game
 * interface. Do NOT restore the saved game
 * into the active state automatically.
 */
state.solution =
    createEmptyGrid();

state.puzzle =
    createEmptyGrid();

state.board =
    createEmptyGrid();

state.candidates =
    createEmptyCandidates();

selectDifficulty("easy");

timerElement.textContent =
    "00:00";

difficultyDisplay.textContent =
    "EASY";

renderBoard();

/*
 * Every page load starts on the start screen.
 * The Continue button is shown only if a
 * valid saved game is available.
 */
state.running = false;
state.completed = false;

startScreen.classList.remove(
    "hidden"
);

updateContinueButton();
</script>
